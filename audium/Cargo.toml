[package]
name = "audium"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = [ "Nikhil",]
repository = "https://github.com/nikcodex/Audium"
build = "build.rs"

[lib]
path = "audium-voice/lib.rs"

# Build script provides libopus for the hand-rolled FFI in `audium-voice/opus/ffi.rs`:
# pkg-config probe on Unix when available, otherwise a vendored CMake build of opus
# (Windows, Android, and containerized builds). Replaces the unmaintained audiopus_sys
# (RUSTSEC-2026-0150).
[build-dependencies]
cmake = "0.1"
pkg-config = "0.3"

[dependencies]
aes-gcm = "0.10.3"

# XChaCha20-Poly1305 is the transport encryption mode Discord *requires*
# (`aead_xchacha20_poly1305_rtpsize`).
chacha20poly1305 = "0.10.1"
davey = "0.1.4"
aes = "0.8"
des = "0.8.1"
cipher = "0.5.0"
block-padding = "0.4.2"
hex = "0.4.3"
blowfish = "0.9"
md-5 = "0.10"
cbc = "0.1"
urlencoding = "2.1.3"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
perf_monitor = "0.2.1"

[dependencies.base64]
workspace = true

[dependencies.bytes]
workspace = true

[dependencies.flume]
workspace = true

[dependencies.dashmap]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.futures]
workspace = true

[dependencies.async-trait]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.byteorder]
workspace = true

[dependencies.regex]
workspace = true

[dependencies.ipnet]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.toml]
workspace = true

[dependencies.parking_lot]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.sysinfo]
workspace = true

[dependencies.prometheus]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.time]
workspace = true

[dependencies.symphonia]
version = "0.5.5"
features = [ "aac", "mp3", "ogg", "flac", "wav", "isomp4", "mkv", "alac",]

[dependencies.tokio-tungstenite]
version = "0.26.2"
features = [ "rustls-tls-native-roots",]

[dependencies.tokio-util]
version = "0.7.13"
features = [ "codec",]

[dependencies.uuid]
workspace = true

[dependencies.reqwest]
workspace = true

[dependencies.rustls]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.axum]
workspace = true

[dependencies.tower-http]
workspace = true
