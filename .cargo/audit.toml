# cargo-audit configuration for Audium.
#
# CI runs BOTH `cargo deny check advisories` (deny.toml) and `cargo audit`.
# cargo-deny silently SKIPS advisories that only constrain `affected.functions`
# (no floor/ceiling in [versions]); cargo-audit does not, so cargo-audit is the
# authoritative gate. Every ignore here mirrors an entry in deny.toml.
#
# Reachability was verified against the *compiled* dependency graph, not just
# Cargo.lock (which also lists optional deps that are never built):
#
#   * `hpke-rs` is resolved with features hazmat,serde,serialization,std,tls_codec
#     ONLY. Its optional `libcrux` feature is OFF, so `hpke-rs-libcrux` (and its
#     transitive libcrux-kem / libcrux-aesgcm / libcrux-chacha20poly1305) is
#     never compiled or linked (0 fingerprints, 0 symbols in the binary).
#     DAVE/MLS uses the RustCrypto backend `hpke-rs-rust-crypto`
#     (openmls_rust_crypto -> hpke-rs with default rustcrypto backend).
#   * The only libcrux crates actually compiled are `libcrux-sha3`,
#     `libcrux-secrets` (transitively via libcrux-sha3) and their support crates.
#
# `scripts/check_libcrux_backend.py` (run in CI) fails the build if any of the
# non-compiled crates enters the graph or if hpke-rs' `libcrux` feature turns on,
# so these ignores cannot silently go stale.
[advisories]
ignore = [
    # RUSTSEC-2026-0212: libcrux-secrets 0.0.5 constant-time swap/select is
    # wrong only on aarch64. COMPILED but the affected `Select`/`Swap` methods
    # are only invoked from the libcrux-aesgcm AEAD path (not compiled) and from
    # libcrux-secrets' own internals; no compiled caller uses them (0 symbols).
    "RUSTSEC-2026-0212",
    # RUSTSEC-2026-0207: libcrux-sha3 0.0.8. COMPILED, but the affected API is
    # the portable *incremental* XOF `squeeze`; hpke-rs calls only the one-shot
    # `shake256::<N>` (32/64), never the multi-call incremental squeeze.
    "RUSTSEC-2026-0207",
    # RUSTSEC-2026-0208: libcrux-sha3 0.0.8. COMPILED, but the affected API is
    # `avx2::x4::shake256`; the linked impl is `simd::portable` (no avx2 symbols
    # in the binary) and the 32/64-byte output never triggers the >32/non-8 case.
    "RUSTSEC-2026-0208",
    # RUSTSEC-2026-0209: libcrux-aesgcm 0.0.7 is NOT compiled or linked (see
    # header). Not reachable.
    "RUSTSEC-2026-0209",
    # RUSTSEC-2026-0211: libcrux-aesgcm 0.0.7 is NOT compiled or linked (see
    # header); the RustCrypto backend provides AEAD. Not reachable.
    "RUSTSEC-2026-0211",
    # RUSTSEC-2026-0124: libcrux-chacha20poly1305 0.0.7 is NOT compiled or
    # linked (see header). Not reachable.
    "RUSTSEC-2026-0124",
    # RUSTSEC-2026-0330: libcrux-kem 0.0.7 is NOT compiled or linked (see
    # header); no seed-based hybrid encapsulation path exists. Not reachable.
    "RUSTSEC-2026-0330",
    # RUSTSEC-2026-0331: libcrux-kem 0.0.7 is NOT compiled or linked (see
    # header); hpke-rs-libcrux decode path is unused and DAVE negotiates ECDH
    # P-256/X25519, not the hybrid ML-KEM KEMs. Not reachable.
    "RUSTSEC-2026-0331",
]
