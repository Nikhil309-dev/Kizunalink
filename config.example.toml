# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.anghami]
enabled = false
search_limit = 10
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.shazam]
# Disabled: shazam.com's catalog API now returns 403 to datacenter traffic,
# so search can never resolve. Enable manually only if it works in your network.
enabled = false
search_limit = 10
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.mixcloud]
enabled = true
search_limit = 10
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.bandcamp]
# Disabled: bandcamp.com/search serves a CSP "Client Challenge" anti-bot wall,
