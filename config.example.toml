lrclib = true
genius = true
deezer = true
yandex = true
musixmatch = true
letrasmus = true
netease = true

[filters]
volume = true
equalizer = true
karaoke = true
timescale = true
tremolo = true
vibrato = true
distortion = true
rotation = true
channel_mix = true
low_pass = true
echo = true
high_pass = true
normalization = true
chorus = true
compressor = true
flanger = true
phaser = true
phonograph = true
reverb = true
spatial = true


[metrics.prometheus]
enabled = false
endpoint = "/metrics"

# Emit the additive `detailedStats` block on GET /v4/stats (NodeLink parity:
# request/error counters, source counts, playback event totals). Off by default
# so the payload stays byte-identical to Lavalink's.
detailed_stats = false
