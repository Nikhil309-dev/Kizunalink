# Required when enabling local playback; paths outside this directory are rejected.
media_dir = "./media"

[sources.reddit]
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.lastfm]
enabled = false
search_limit = 10
# Create your API key here: https://www.last.fm/api/account/create
# api_key = "your-lastfm-api-key"

[sources.twitch]
enabled = true
# client_id = "your-client-id"  # leave blank for auto-discovery from twitch.tv
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.amazonmusic]
# Requires an authenticated Amazon Music session (accessToken/csrf from
# music.amazon.com/config.json); without one it returns empty results.
# Disabled by default because the public site config cannot authenticate.
enabled = false
search_limit = 10
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.rss]
# Expands an RSS/Atom podcast feed URL into a playlist of its media enclosures.
# Matches feed URLs (*.rss, /feed, /rss, feed.xml, /podcast/.../rss).
enabled = false
# Maximum items expanded into a playlist (hard cap 500).
max_items = 100
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.iheartradio]
# Resolves public iHeart *live* radio stations (iheart.com/live/<id>) to their
# live stream, and "ihsearch:<query>" to station search results. No key needed.
# On-demand songs are not exposed (protected streams).
enabled = false
search_limit = 10
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.bluesky]
# Resolves a public Bluesky post's embedded video (bsky.app/profile/<handle>/post/<rkey>).
# Uses the unauthenticated public AppView API; no credentials required.
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.vimeo]
# Resolves public Vimeo videos (vimeo.com/<id>) to the best progressive MP4.
# No API key required.
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.pinterest]
# Resolves public Pinterest video pins (pinterest.<tld>/pin/<id>, /ideas/...).
# Tries the internal PinResource API before falling back to page scraping.
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.googledrive]
# Resolves public Google Drive files (drive.google.com/file/d/<id>) to a direct
# download stream. Files must be shared as "anyone with the link".
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.songlink]
# Resolver, not a media source: expands a streaming-service share link
# (song.link / album.link / a supported provider URL) into its cross-service
# mirrors and re-dispatches to whichever configured source can play one.
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.bilibili]
# Resolves bilibili.com video/BV/av links, b23.tv short links, bangumi and
# audio pages. Playback is the anonymous DASH audio stream.
# Optional: a SESSDATA cookie unlocks higher quality / member-only content.
enabled = false
# sessdata = ""
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.nicovideo]
# Resolves nicovideo.jp/watch/<id> and nico.ms/<id>, plus "ncsearch:<query>".
# Playback uses an anonymous DMC session; no account required.
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.instagram]
# Resolves public Instagram posts (/p/<code>) and reels (/reel/<code>), plus
# reel-audio pages (/reels/audio/<id>). Public content only; no login.
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.twitter]
# Resolves twitter.com / x.com status links to the best MP4 (or HLS) variant.
# Uses the public guest-token GraphQL endpoint; no account or API key required.
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.tiktok]
# Resolves TikTok video links (tiktok.com/@user/video/<id>) and short links
# (vm.tiktok.com/<code>) to a playable MP4. Also serves `ttsearch:` queries.
enabled = false
# search_limit = 10
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.tumblr]
# Resolves public Tumblr video/audio posts (blog.tumblr.com/post/<id>).
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.telegram]
# Resolves public Telegram post links (t.me/<channel>/<id>) to their media.
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[sources.pixeldrain]
# Resolves Pixeldrain audio files (pixeldrain.com/u/<id>, music.song only).
enabled = false
# proxy = { url = "http://proxy:8080", username = "user", password = "pass" }

[lyrics]
