# cargo-deny configuration for KizunaLink
# See https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check
#
# CI runs `cargo deny check advisories` (this file) AND `cargo audit`
# (.cargo/audit.toml). cargo-deny silently skips advisories that only constrain
# `affected.functions` with no floor/ceiling in their `[versions]` block
# (RUSTSEC-2026-0209/0211/0124/0330/0331); cargo-audit catches them, so it is
# the authoritative gate. Keep the two ignore lists in sync.
# The license/bans sections below are available for local use.

[advisories]
# Fail on any RustSec advisory, and on yanked crate versions.
yanked = "deny"

# Documented technical exceptions for advisories without safe upstream upgrades:
ignore = [
    # RUSTSEC-2026-0212: libcrux-secrets 0.0.5 - Transitive dependency from openmls_rust_crypto -> hpke-rs-libcrux v0.6.1 which pins exact libcrux version.
    "RUSTSEC-2026-0212",
    # RUSTSEC-2026-0207: libcrux-sha3 0.0.8 - Transitive dependency from openmls_rust_crypto -> hpke-rs-libcrux v0.6.1 which pins exact libcrux version.
    "RUSTSEC-2026-0207",
    # RUSTSEC-2026-0208: libcrux-sha3 0.0.8 - Transitive dependency from openmls_rust_crypto -> hpke-rs-libcrux v0.6.1 which pins exact libcrux version.
    "RUSTSEC-2026-0208",
    # RUSTSEC-2020-0168: mach 0.3.2 - Unmaintained transitive dependency from perf_monitor 0.2.1 (macOS metrics).
    "RUSTSEC-2020-0168",
    # RUSTSEC-2026-0173: proc-macro-error2 2.0.1 - Unmaintained transitive dependency from hax-lib-macros (libcrux build macro).
    "RUSTSEC-2026-0173",
    # RUSTSEC-2024-0384: instant 0.1.13 - Unmaintained transitive dependency from fluvio-wasm-timer (openmls).
    "RUSTSEC-2024-0384",
    # RUSTSEC-2021-0139: ansi_term 0.12.1 - Unmaintained transitive dependency via bindgen 0.59 (perf_monitor build-dependency).
    "RUSTSEC-2021-0139",
    # RUSTSEC-2024-0375: atty 0.2.14 - Unmaintained transitive dependency via bindgen 0.59 (perf_monitor build-dependency).
    "RUSTSEC-2024-0375",
]

[licenses]
# KizunaLink is MIT-licensed. Allow-list permissive licenses explicitly; anything not
# listed here (strong copyleft included) fails `cargo deny check licenses`.
# (cargo-deny >= 0.16 removed the `default`/`copyleft` keys — see EmbarkStudios/cargo-deny#611.)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
