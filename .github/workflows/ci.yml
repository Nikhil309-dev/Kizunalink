name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  LIBOPUS_STATIC: "1"
  OPUS_STATIC: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl libopus-dev
      - name: Guard: every `| tee` pipeline sets `set -o pipefail`
        run: python3 scripts/check_ci_pipefail.py
      - name: cargo check
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --color=never 2>&1 | tee /tmp/check.log | perl -e '
            my ($m, $lvl) = ("", "");
            while (<STDIN>) {
              if (/^error(?:\[[^\]]+\])?:\s*(.*)$/) { $m = $1; $lvl = "error"; }
              elsif (/^warning(?:\[[^\]]+\])?:\s*(.*)$/) { $m = $1; $lvl = "warning"; }
              elsif (/^\s*-->\s*([^:]+):(\d+):(\d+)/ && $m ne "") {
                print "::$lvl file=$1,line=$2,col=$3::$m\n";
                $m = ""; $lvl = "";
              }
            }
          '
      - name: Surface check failure
        if: failure()
        run: |
          if [ -f /tmp/check.log ]; then
            perl -e '
              my $m = "";
              while (<STDIN>) {
                if (/^error(?:\[[^\]]+\])?:\s*(.*)$/) { print "ERR: $1\n"; }
                elsif (/^warning(?:\[[^\]]+\])?:\s*(.*)$/) { print "WARN: $1\n"; }
                elsif (/^\s*-->\s*([^:]+):(\d+):(\d+)/) { print "  AT $1:$2:$3\n"; }
              }
            ' < /tmp/check.log | head -c 60000 | tr '\n' '~' > /tmp/tail.txt
            echo "::error file=ci-check.log,line=1::$(cat /tmp/tail.txt)"
          fi

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee /tmp/fmt.log | perl -e '
            my $n = 0;
            while (<STDIN>) {
              # rustfmt diff headers:Diff in <path> at line N:
              if (/^Diff in (\S+) at line (\d+)/) {
                print "::warning file=$1,line=$2::rustfmt diff starts here\n";
                exit if ++$n >= 45;
              }
            }
          '
      - name: Surface fmt diff
        if: failure()
        run: |
          if [ -s /tmp/fmt.log ]; then
            head -c 60000 /tmp/fmt.log | tr '\n' '~' > /tmp/tail.txt
            echo "::error file=fmt.diff,line=1::$(cat /tmp/tail.txt)"
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl libopus-dev
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --color=never -- -D warnings 2>&1 | tee /tmp/clippy.log | perl -e '
            my ($m, $lvl) = ("", "");
            while (<STDIN>) {
              if (/^error(?:\[[^\]]+\])?:\s*(.*)$/) { $m = $1; $lvl = "error"; }
              elsif (/^warning(?:\[[^\]]+\])?:\s*(.*)$/) { $m = $1; $lvl = "warning"; }
              elsif (/^\s*-->\s*([^:]+):(\d+):(\d+)/ && $m ne "") {
                print "::$lvl file=$1,line=$2,col=$3::[clippy] $m\n";
                $m = ""; $lvl = "";
              }
            }
          '
      - name: Surface clippy failure
        if: failure()
        run: |
          if [ -f /tmp/clippy.log ]; then
            perl -e '
              my $m = "";
              while (<STDIN>) {
                if (/^(error|warning)(?:\[[^\]]+\])?:\s*(.*)$/) { print "UP: $1 $2\n"; }
                elsif (/^\s*-->\s*([^:]+):(\d+)/) { print "  AT $1:$2\n"; }
                elsif (/^\s*help:\s*(.*)$/) { my $h=$1; $h =~ s/\s+$//; print "  HELP $h\n" if length($h) < 200; }
              }
            ' < /tmp/clippy.log | head -c 60000 | tr '\n' '~' > /tmp/tail.txt
            echo "::error file=ci-clippy.log,line=1::$(cat /tmp/tail.txt)"
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl libopus-dev
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --color=never 2>&1 | tee /tmp/test.log | perl -e '
            my $n = 0;
            while (<STDIN>) {
              if (/^(.*: FAILED|failures:|.*panicked at .*)$/) {
                my $msg = $1; $msg =~ s/^\s+//; $msg = substr($msg, 0, 180);
                print "::error ::$msg\n";
                exit if ++$n >= 45;
              }
            }
          '
      - name: Surface test failure
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            {
              echo "=== failed tests ==="; grep -E "^(test .* FAILED|failures:)" /tmp/test.log | head -40
              echo "=== panic excerpts ==="; grep -B2 -A8 "panicked at" /tmp/test.log | head -120
              echo "=== compile errors ==="; grep -E "^error" /tmp/test.log | head -30
            } | head -c 60000 | tr '\n' '~' > /tmp/tail.txt
            echo "::error file=ci-test.log,line=1::$(cat /tmp/tail.txt)"
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl libopus-dev
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install opus cmake pkg-config
      - name: cargo build --release
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --workspace --color=never 2>&1 | tee /tmp/build.log | perl -e '
            my ($m, $lvl, $n) = ("", "", 0);
            while (<STDIN>) {
              if (/^error(?:\[[^\]]+\])?:\s*(.*)$/) { $m = $1; $lvl = "error"; }
              elsif (/^warning(?:\[[^\]]+\])?:\s*(.*)$/) { $m = $1; $lvl = "warning"; }
              elsif (/^\s*-->\s*(.+?):(\d+):(\d+)/ && $m ne "" && $lvl eq "error") {
                # Windows paths may contain a drive colon ("D:\a\src\x.rs") — keep all but the last two colon fields.
                my $f = $1; my ($l, $c) = ($2, $3);
                print "::error file=$f,line=$l,col=$c::$m\n";
                exit if ++$n >= 15;
                $m = ""; $lvl = "";
              }
            }
          '
      - name: Surface build failure
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            grep -iE "error|cannot find|not found|fatal|undefined symbol|LNK[0-9]|MSB[0-9]" /tmp/build.log | grep -v "could not compile" | tail -c 16000 | tr '\n' '~' | tr -d '"%' > /tmp/tail.txt || true
            echo "::error file=build.log,line=1::$(cat /tmp/tail.txt)" || true
          fi
        shell: bash

  deny:
    name: Cargo Deny (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Guard: vulnerable libcrux crates stay out of the build graph
        run: python3 scripts/check_libcrux_backend.py
      - name: cargo deny check advisories
        run: |
          set -o pipefail
          cargo deny check advisories 2>&1 | tee /tmp/deny.log | perl -e '
            my $n = 0;
            while (<STDIN>) {
              s/\e\[[0-9;]*m//g;
              if (/RUSTSEC-\d{4}-\d{4}/) {
                my $m = $_; $m =~ s/^\s+//; $m =~ s/\s+$//; $m = substr($m, 0, 200);
                print "::error ::$m\n";
                exit if ++$n >= 40;
              }
            }
          '
      - name: Surface deny summary
        if: failure()
        run: |
          if [ -f /tmp/deny.log ]; then
            grep -vE "^\s*(Fetching|Advancing|Configuration)" /tmp/deny.log | head -c 60000 | tr '\n' '~' | sed 's/~/ /g' > /tmp/tail.txt
            echo "::error file=deny.log,line=1::$(cat /tmp/tail.txt)"
          fi
      # cargo-deny silently skips advisories that only constrain
      # `affected.functions` (no floor/ceiling in [versions]); cargo-audit does
      # not, so it is the authoritative gate. Ignores mirror deny.toml and live
      # in .cargo/audit.toml.
      - name: cargo audit
        run: |
          # `set -o pipefail` is required: without it the pipeline's exit status
          # is `tee`'s (always 0), so a failing `cargo audit` (inside the pipe)
          # would be reported as success. GitHub's implicit `bash -e` does not
          # set `pipefail`; every other step in this file sets it explicitly.
          set -o pipefail
          cargo audit 2>&1 | tee /tmp/audit.log
      - name: Surface audit failure
        if: failure()
        run: |
          if [ -f /tmp/audit.log ]; then
            grep -iE "vulnerab|RUSTSEC|Crate:|Title:" /tmp/audit.log | head -c 60000 | tr '\n' '~' > /tmp/tail.txt
            echo "::error file=audit.log,line=1::$(cat /tmp/tail.txt)"
          fi
