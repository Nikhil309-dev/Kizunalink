name: 🚀 Audium Release Pipeline

# Builds and publishes the prebuilt Linux binaries that the Pterodactyl/Nexio
# Host deployment consumes. The recommended artifact is
# `kizunalink-linux-x86_64-musl` (fully static: no glibc or shared-library
# requirement). `kizunalink-linux-amd64` is the standard glibc x86_64 build
# (needs glibc >= 2.34 at runtime).
#
# Triggers:
#   * release: published  — the normal path: build and attach assets to the tag.
#   * workflow_dispatch   — manual rebuild for an existing tag (see `tag` input).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish assets to (e.g. v1.1.0). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # libopus is linked statically (vendored CMake build of native/opus) so the
  # shipped binary has no runtime libopus dependency. See audium/build.rs.
  LIBOPUS_STATIC: "1"
  OPUS_STATIC: "1"

jobs:
  # Standard glibc-linked Linux binaries (x86_64 + aarch64).
  build-linux:
    name: 🐧 Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - name: 📥 Checkout source (release tag or dispatched ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 📦 Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: 🎯 Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: 🔧 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libclang-dev \
            clang \
            git \
            build-essential \
            perl

          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: 🏗 Build release binary
        run: |
          export BUILD_TIME="$(date -u +%s)"
          export BUILD_TIME_HUMAN="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export GIT_BRANCH="${GITHUB_REF_NAME}"
          export GIT_COMMIT="${GITHUB_SHA}"
          export GIT_COMMIT_SHORT="${GITHUB_SHA:0:7}"
          export GIT_COMMIT_TIME="$(git log -1 --format=%ct)"
          export GIT_COMMIT_TIME_HUMAN="$(git log -1 --format=%cI)"
          cargo build --release --locked --target ${{ matrix.target }}

      - name: 📦 Rename binary and write SHA-256
        run: |
          cd target/${{ matrix.target }}/release
          mv audium-server kizunalink-linux-${{ matrix.arch }}
          sha256sum kizunalink-linux-${{ matrix.arch }} > kizunalink-linux-${{ matrix.arch }}.sha256
          cat kizunalink-linux-${{ matrix.arch }}.sha256

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kizunalink-linux-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/kizunalink-linux-${{ matrix.arch }}
            target/${{ matrix.target }}/release/kizunalink-linux-${{ matrix.arch }}.sha256

  # Fully static musl build: runs on any x86_64 Linux regardless of glibc
  # version or installed shared libraries. This is the recommended Pterodactyl /
  # Nexio Host artifact.
  build-linux-musl:
    name: 🐧 Build Linux (x86_64 static)
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout source (release tag or dispatched ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: 📦 Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: 🔧 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libclang-dev \
            clang \
            git \
            build-essential \
            perl \
            musl-tools

      - name: 🏗 Build static release binary
        run: |
          # Explicit so the target is present on the exact toolchain that
          # rust-toolchain.toml resolves to (channel = "stable").
          rustup target add x86_64-unknown-linux-musl
          export BUILD_TIME="$(date -u +%s)"
          export BUILD_TIME_HUMAN="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export GIT_BRANCH="${GITHUB_REF_NAME}"
          export GIT_COMMIT="${GITHUB_SHA}"
          export GIT_COMMIT_SHORT="${GITHUB_SHA:0:7}"
          export GIT_COMMIT_TIME="$(git log -1 --format=%ct)"
          export GIT_COMMIT_TIME_HUMAN="$(git log -1 --format=%cI)"
          cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: 📦 Rename binary and write SHA-256
        run: |
          cd target/x86_64-unknown-linux-musl/release
          mv audium-server kizunalink-linux-x86_64-musl
          sha256sum kizunalink-linux-x86_64-musl > kizunalink-linux-x86_64-musl.sha256
          cat kizunalink-linux-x86_64-musl.sha256

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kizunalink-linux-x86_64-musl
          path: |
            target/x86_64-unknown-linux-musl/release/kizunalink-linux-x86_64-musl
            target/x86_64-unknown-linux-musl/release/kizunalink-linux-x86_64-musl.sha256

  # Build & push the multi-arch container image from the glibc binaries.
  docker:
    name: 🐳 Build & Push Docker Image
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 📥 Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: kizunalink-linux-*

      - name: 📂 Organize binaries
        run: |
          mkdir -p bin/linux/amd64 bin/linux/arm64
          mv bin/kizunalink-linux-amd64/kizunalink-linux-amd64 bin/linux/amd64/audium
          mv bin/kizunalink-linux-arm64/kizunalink-linux-arm64 bin/linux/arm64/audium
          chmod +x bin/linux/amd64/audium bin/linux/arm64/audium

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷 Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 🚀 Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Use the 'ci' stage — builder stage is NOT triggered.
          target: ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish all release assets (binaries, checksums, runtime-dependency list and
  # the deployment guide).
  publish:
    name: 📦 Publish Release Assets
    needs: [build-linux, build-linux-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && needs.build-linux.result == 'success' && needs.build-linux-musl.result == 'success'

    steps:
      - name: 📥 Checkout source (for docs)
        uses: actions/checkout@v4

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📄 Build runtime-dependency list
        run: |
          cat > artifacts/runtime-deps.txt <<'EOF'
          Audium Linux release — runtime library requirements
          ========================================================

          kizunalink-linux-x86_64-musl  (RECOMMENDED for Pterodactyl / Nexio Host)
            Statically linked. No external shared libraries, no Rust toolchain,
            no glibc version requirement. Runs on any x86_64 Linux.

          kizunalink-linux-amd64  (standard glibc x86_64)
            Requires only the base C runtime shipped with every mainstream
            distro. No libopus (linked statically):
              * libgcc_s.so.1
              * libm.so.6
              * libc.so.6   (glibc >= 2.34 — Debian 12+, Ubuntu 22.04+)
            If the host glibc is older (e.g. Debian 10 / Pterodactyl's stock
            ghcr.io/pterodactyl/yolks:debian is glibc 2.28), use the musl build.

          kizunalink-linux-arm64  (standard glibc aarch64)
            Same runtime requirements as kizunalink-linux-amd64.

          Verify a download with:
            sha256sum -c kizunalink-linux-<arch>.sha256
          Inspect a binary's dependencies with:
            ldd ./kizunalink-linux-<arch>
          EOF
          # Strip the heredoc's leading indentation so the file is clean.
          sed -i 's/^          //' artifacts/runtime-deps.txt
          cat artifacts/runtime-deps.txt

      - name: 📄 Stage deployment guide
        run: |
          cp DEPLOYMENT.md artifacts/DEPLOYMENT.md
          ls -R artifacts

      - name: 🚀 Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || inputs.tag != ''
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
